name: MoonWitness Web Experience

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".github/workflows/flectra-nextjs.yml"
      - "addons/web/static/src/**"
      - "addons/web/static/img/**"
      - "addons/web/controllers/**"
      - "addons/web/tests/**"
      - "addons/moonwitness_base/**"
      - "addons/moonwitness_arsy/views/**"
      - "addons/moonwitness_orchestrator/views/**"
      - "docs/brand/**"
      - "README.md"
      - "scripts/check-moonwitness-brand.mjs"
      - "flectra/release.py"
      - "Dockerfile"
      - ".env.example"
  push:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".github/workflows/flectra-nextjs.yml"
      - "addons/web/static/src/**"
      - "addons/web/static/img/**"
      - "addons/web/controllers/**"
      - "addons/moonwitness_base/**"
      - "addons/moonwitness_arsy/views/**"
      - "addons/moonwitness_orchestrator/views/**"
      - "docs/brand/**"
      - "README.md"
      - "scripts/check-moonwitness-brand.mjs"
      - "flectra/release.py"
      - "Dockerfile"
      - ".env.example"

permissions:
  contents: read

concurrency:
  group: moonwitness-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run public-surface brand audit
        run: node scripts/check-moonwitness-brand.mjs
      - name: Enable pnpm
        run: npm install -g pnpm@10.9.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

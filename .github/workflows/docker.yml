name: Docker image

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - ".gitignore"
      - "custom-addons/**"
      - "tests/docker/**"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - ".gitignore"
      - "custom-addons/**"
      - "tests/docker/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: flectra-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n entrypoint.sh
          bash -n tests/docker/test-entrypoint.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh tests/docker/test-entrypoint.sh

      - name: Test entrypoint initialization paths
        run: bash tests/docker/test-entrypoint.sh

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          ADMIN_PASSWD: ci-flectra-master-password
        run: docker compose config --quiet

      - name: Build Flectra image
        run: docker build --pull --tag flectra:ci .

      - name: Smoke-test Flectra executable and Bash entrypoint
        run: docker run --rm flectra:ci --version

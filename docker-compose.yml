
name: flectra

services:
  # -----------------------------------------------
  # Go host agent (owns docker.sock; internal only)
  # -----------------------------------------------
  arsy-agent:
    build: ./docker-agent
    container_name: flectra-arsy-agent

    environment:
      PANEL_TOKEN: ${PANEL_TOKEN:?Set PANEL_TOKEN in .env}
      POSTGRES_USER: ${POSTGRES_USER:-flectra}
      BACKUP_DIR: /backups

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arsy-backups:/backups

    depends_on:
      - flectra

    restart: unless-stopped

    networks:
      - flectra-network

  # -----------------------------------------------
  # Node services orchestrator (Fastify + plugins)
  # -----------------------------------------------
  orchestrator:
    build: ./services/orchestrator
    container_name: flectra-orchestrator

    environment:
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:?Set ORCHESTRATOR_TOKEN in .env}
      WA_SESSION_DIR: /data/wa-session
      PORT: "8090"

    volumes:
      - orchestrator-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    networks:
      - flectra-network

  # -----------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------
  db:
    image: postgres:15
    container_name: flectra-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flectra}

    volumes:
      - flectra-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - flectra-network

  # -----------------------------------------------
  # Flectra Application
  # -----------------------------------------------
  flectra:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flectra-app

    depends_on:
      db:
        condition: service_healthy

    ports:
      # HTTP
      - "${FLECTRA_BIND_IP:-127.0.0.1}:${FLECTRA_PORT:-8069}:8069"

      # WebSocket / Gevent
      - "${FLECTRA_BIND_IP:-127.0.0.1}:${FLECTRA_GEVENT_PORT:-8072}:8072"

    environment:
      # -------------------------------------------
      # PostgreSQL connection
      # -------------------------------------------
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-flectra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      # -------------------------------------------
      # Flectra server
      # -------------------------------------------
      HTTP_PORT: "8069"
      GEVENT_PORT: "8072"

      # -------------------------------------------
      # Master administration password
      # -------------------------------------------
      ADMIN_PASSWD: ${ADMIN_PASSWD:?Set ADMIN_PASSWD in .env}

      # -------------------------------------------
      # Optional productivity applications
      # -------------------------------------------
      DEFAULT_PRODUCTIVITY_APPS: ${DEFAULT_PRODUCTIVITY_APPS:-false}

      # -------------------------------------------
      # Database manager
      # -------------------------------------------
      LIST_DB: "True"

      # -------------------------------------------
      # First-boot database initialization
      # -------------------------------------------
      INIT_DB: ${INIT_DB:-false}

    volumes:
      # Persistent Flectra data and filestore
      - flectra-data:/var/lib/flectra

      # Custom addons
      - ./addons:/opt/flectra/addons:ro

    # Explicitly put Flectra data inside persistent volume.
    # Compatible with the revised entrypoint.
    command:
      - --data-dir=/var/lib/flectra

    init: true

    restart: unless-stopped

    stop_grace_period: 60s

    networks:
      - flectra-network

# -----------------------------------------------
# Persistent volumes
# -----------------------------------------------
volumes:
  flectra-db-data:
    driver: local

  flectra-data:
    driver: local

  arsy-backups:
    driver: local

  orchestrator-data:
    driver: local

# -----------------------------------------------
# Internal network
# -----------------------------------------------
networks:
  flectra-network:
    driver: bridge

version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flectra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flectra}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - flectra-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flectra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flectra:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FLECTRA_PORT:-8069}:8069"
      - "${FLECTRA_LONGPOLL_PORT:-8072}:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-flectra}
      PASSWORD: ${POSTGRES_PASSWORD:-flectra}
      DB: ${POSTGRES_DB:-postgres}
      # master admin password for managing databases
      ADMIN_PASSWD: ${ADMIN_PASSWD:-admin}
    volumes:
      - flectra-data:/var/lib/flectra
      - ./addons:/opt/flectra/addons:ro
      - ./flectra/addons:/opt/flectra/flectra/addons:ro
    restart: unless-stopped

volumes:
  flectra-db-data:
  flectra-data:
image: ubuntu:24.04

stages:
  - test

variables:
  POSTGRESQL_VERSION: "14"

job_test_base:
  stage: test
  tags:
    - flectra
  script:
    - apt-get update
    - apt-get install -y git locales
    - git clone -b 3.0 https://gitlab.com/flectra-hq/build-tools.git ${CI_PROJECT_DIR}/build-tools
    - export PATH=${CI_PROJECT_DIR}/build-tools/gitlab-ci:${PATH}
    - gitlab_ci_install_flectra
    - su - flectra -c "export PATH=${CI_PROJECT_DIR}/build-tools/gitlab-ci:${PATH} && gitlab_test_flectra --build=base"

